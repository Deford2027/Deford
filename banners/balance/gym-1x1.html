<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Balance — тренажёрный зал, 1:1</title>
<style>
  /* Фирменный шрифт — Harmonia Sans Pro Cyr (лицензионный). Если он установлен, подхватится первым;
     иначе используется TildaSans с сайта balance-fit.ru. */
  @font-face { font-family: "TildaSans"; src: url("../../fonts/TildaSans-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "TildaSans"; src: url("../../fonts/TildaSans-Semibold.woff2") format("woff2"); font-weight: 600; }

  :root {
    /* Палитра из брендбука Balance 2023 */
    --black: #000000;
    --white: #ffffff;
    --electric-green: #c3e900; /* только для «искры» */
    --high-blue: #28348a;
    --red: #ff3f49;
    --deep-blue: #00244b;

    --pad: 44px;   /* поле по периметру = половина ширины «искры» */
    --spark: 88px;
    --r: 40px;     /* скругление модулей */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; background: var(--black); }
  body { font-family: "Harmonia Sans Pro Cyr", "TildaSans", Arial, sans-serif; color: var(--white); -webkit-font-smoothing: antialiased; }

  .banner { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: var(--black); }
  .m { position: absolute; border-radius: var(--r); overflow: hidden; }

  /* Модуль D — фото зала */
  .photo {
    left: var(--pad); top: var(--pad); width: 992px; height: 420px;
    background: url("assets/gym.jpg") 40% 48% / 118% auto no-repeat;
    filter: contrast(.9) saturate(.85) brightness(1.04);
  }
  .logo { position: absolute; left: 40px; bottom: 36px; width: 202px; height: 48px; }

  /* Модуль A — текстовый, High Blue */
  .info { left: var(--pad); top: 470px; width: 600px; height: 444px; background: var(--high-blue); padding: 38px 40px; }
  .info h1 { font-size: 54px; font-weight: 400; line-height: 1.02; letter-spacing: -.005em; }
  .info ul { list-style: none; margin-top: 40px; }
  .info li { position: relative; padding-left: 34px; font-size: 29px; line-height: 1.22; }
  .info li + li { margin-top: 18px; }
  .info li::before { content: ""; position: absolute; left: 2px; top: 13px; width: 12px; height: 12px; border-radius: 50%; background: var(--white); }
  .info b { font-weight: 600; }

  /* Модуль B — цена, Red */
  .price { left: 650px; top: 470px; width: 386px; height: 444px; background: var(--red); padding: 38px 36px; display: flex; flex-direction: column; }
  .price__label { font-size: 26px; line-height: 1.2; }
  .price__bottom { margin-top: auto; }
  .price__old { font-size: 36px; opacity: .75; text-decoration: line-through; text-decoration-thickness: 2px; }
  .price__new { margin-top: 6px; font-size: 78px; font-weight: 600; line-height: 1; letter-spacing: -.02em; white-space: nowrap; }
  .price__per { margin-top: 8px; font-size: 32px; }

  /* Модуль — кнопка */
  .cta {
    left: var(--pad); top: 920px; width: 992px; height: 116px; background: var(--deep-blue);
    display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 40px;
    font-size: 36px; font-weight: 600;
  }
  .cta i { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--white); }

  /* Символ «искра» на пересечениях модулей */
  .spark { position: absolute; width: var(--spark); height: var(--spark); margin: calc(var(--spark) / -2) 0 0 calc(var(--spark) / -2); }
</style>
</head>
<body>
<div class="banner">
  <div class="m photo"></div>

      <path d="M147.32 29.63H161.25C160.89 26.24 158.23 23.17 154.31 23.17C150.21 23.17 147.64 26.33 147.32 29.63ZM164.99 31.3C164.99 31.71 164.94 32.38 164.9 32.61H147.28C147.28 36.54 150.89 40.02 154.94 40.02C157.51 40.02 159.09 39.07 160.48 37.4H164.58C163.14 40.11 160.12 43.18 155.02 43.18C148.17 43.18 143.57 38.03 143.57 31.3C143.57 25.34 147.76 20.06 154.3 20.06C162.15 20.1 164.99 26.56 164.99 31.3Z"/>
      <path d="M15.4401 28.95H4.30006V39.74H16.0701C20.2201 39.74 22.1501 37.57 22.1501 34.41C22.1601 31.03 19.7701 28.95 15.4401 28.95ZM13.7701 15.81H4.30006V25.52H14.0401C17.7401 25.52 19.9901 23.49 19.9901 20.55C19.9901 17.21 17.2901 15.81 13.7701 15.81ZM0.560059 12.38H13.7701C20.1301 12.38 23.8201 15.45 23.8201 20.24C23.8201 23.81 21.4801 25.84 18.8201 26.79V26.88C23.6401 27.38 26.0301 30.76 26.0301 34.69C26.0301 40.52 21.4801 43.18 15.8001 43.18H0.560059V12.38Z"/>
      <path d="M171.36 25.41C171.36 18.45 176.98 12.81 183.92 12.79H183.95V12.62H183.92C176.98 12.6 171.36 6.96 171.36 0H171.19C171.19 6.97 165.550 12.62 158.6 12.62V12.79H171.19V25.41H171.36Z"/>
    </svg>
  </div>

  <div class="m price">
    <div class="price__label">Годовая карта</div>
    <div class="price__bottom">
      <div class="price__old">56&nbsp;550&nbsp;₽</div>
      <div class="price__new">39&nbsp;000&nbsp;₽</div>
      <div class="price__per">/ год</div>
    </div>
  </div>

  <div class="m cta">Забронировать карту по акции
    <i><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6l6 6-6 6" stroke="#00244b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
  </div>

  <!-- «Искра» на пересечениях модулей; упрощённый сегмент повернут к акцентному модулю -->
  <svg class="spark" style="left:647px; top:467px; transform: rotate(-90deg)" viewBox="158.6 0 25.35 25.41"><path fill="#c3e900" d="M171.36 25.41C171.36 18.45 176.98 12.81 183.92 12.79H183.95V12.62H183.92C176.98 12.6 171.36 6.96 171.36 0H171.19C171.19 6.97 165.55 12.62 158.6 12.62V12.79H171.19V25.41H171.36Z"/></svg>
  <svg class="spark" style="left:647px; top:917px" viewBox="158.6 0 25.35 25.41"><path fill="#c3e900" d="M171.36 25.41C171.36 18.45 176.98 12.81 183.92 12.79H183.95V12.62H183.92C176.98 12.6 171.36 6.96 171.36 0H171.19C171.19 6.97 165.55 12.62 158.6 12.62V12.79H171.19V25.41H171.36Z"/></svg>
</div>
</body>
</html>
